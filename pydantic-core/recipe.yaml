context:
  version: 2.50.1

package:
  name: pydantic-core
  version: ${{ version }}

build:
  number: 0
  script: uv pip install --no-deps -vv --system pydantic-core==${{ version }}
  skip:
    - not osx
    - not x86_64
    - build_platform != target_platform

requirements:
  build:
    - ${{ stdlib("c") }}
  host:
    - python
    - python-gil
    - uv >=0.10.2
  run:
    - typing-extensions >=4.16.0

tests:
  - python:
      imports:
        - pydantic_core

about:
  homepage: https://github.com/pydantic/pydantic
  license: MIT
  summary: Core functionality for Pydantic validation and serialization
  repository: https://github.com/pydantic/pydantic/tree/main/pydantic-core
  documentation: https://pydantic.dev/docs/validation/latest/api/pydantic-core/pydantic_core/
